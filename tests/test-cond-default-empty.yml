name: Test condition false with default empty if_false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cond: 'false'
          if_true: 'some-value'
          # if_false not provided, defaults to ''
      - name: Assert output is empty when cond is false and if_false is default
        env:
          ACTUAL: ${{ steps.action.outputs.value }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty string but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
